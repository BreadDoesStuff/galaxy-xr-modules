# GXR Passthrough Anywhere config (read at daemon start; reboot or restart daemon to apply)
# Passthrough opacity when forced on (0.0-1.0). <1.0 blends the app over the room.
ALPHA=1.0
# CPM z-order for the passthrough layer. 9999 = above apps (same as lockscreen/home passthrough).
Z=9999
# Minimum ms between toggles
DEBOUNCE_MS=600
# 1 = react to double-tap in full-space apps, 0 = disabled (action button still works)
ENABLED=1
# 1 = hide XrSystemUI toasts (e.g. "Can't turn Virtual Environment on or off right now")
#     only while a full-space app is focused (appops TOAST_WINDOW for com.android.systemui)
MUTE_SYSUI_TOAST=1
