# Galaxy XR Fan Control config  (/data/adb/gxr-fanctl/config.conf)
# Changes are picked up live by the daemon (no reboot needed).
#
# Fan hardware: 2x fans on MAX31760 driven by the sec_fan driver.
# Steps 0..7 map to PWM (DT step-mapping): 0=0 1=85 2=90 3=95 4=100 5=110 6=120 7=140
# Step 7 is the hardware/driver maximum (~5500 RPM). Stock idle is step 1 (~3450 RPM).

# MODE: stock | max | fixed | curve
#   stock = hand control back to Samsung SSRM (factory behaviour)
#   max   = always step 7
#   fixed = always FIXED_STEP
#   curve = step chosen from CURVE using the hottest sensor in SENSORS
MODE=max

FIXED_STEP=7

# "tempC:step" pairs, ascending. Highest pair whose temp <= current temp wins.
# Below the first pair MIN_STEP is used.
CURVE="36:2 40:3 43:4 46:5 50:6 54:7"
MIN_STEP=1

# Degrees C the temperature must fall below a threshold before stepping down.
HYST=2

# Poll interval in seconds.
INTERVAL=2

# Thermal zone types (shell globs) used for the curve; the max is taken.
SENSORS="cpu-* cpuss-* gpuss-* ddr sys-therm-0"

# Step used if no sensor can be read.
FAILSAFE_STEP=7
