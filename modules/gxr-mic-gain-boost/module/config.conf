# GXR Mic Gain Boost (read at daemon start; reboot or `pkill -f gxr_micd` to apply)
# 1 = boost whenever Virtual Desktop (VOICE_PERFORMANCE source) records the mic.
#     Another recorder running at the same time (e.g. screen recording) shares the mic and also gets it.
# 2 = boost only while Virtual Desktop is the only app recording the mic.
MODE=1
# Codec gain added on top of the HAL's value for the active mic path (1 dB per step, 0-40).
GAIN_DB=15
